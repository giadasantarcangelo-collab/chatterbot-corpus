conversations:

# ======================================================================
# 1. INDIRIZZI DI STUDIO (Licei e Tecnici)
# ======================================================================
- - Quali indirizzi di studio offre l'Istituto "E. Fermi"?
  - Potete dirmi quali sono i percorsi formativi disponibili?
  - Che tipo di scuole superiori posso frequentare al Fermi?
  - Qual è l'offerta formativa completa del vostro istituto?
  - Mi potete fare un elenco degli indirizzi attivi?
  - "L'I.I.S. 'E. Fermi' offre un'ampia gamma di percorsi: Liceo Nautico (Istituto Tecnico Trasporti e Logistica), TrED (Trasporti e Logistica), Liceo Artistico, Liceo Classico, Liceo Scientifico (Tradizionale e Scienze Applicate) e Liceo Linguistico."
  - "Abbiamo attivi sei percorsi principali: i Licei (Artistico, Classico, Scientifico, Linguistico) e l'Istituto Tecnico (Nautico/Trasporti e Logistica)."
  - "L'offerta formativa è molto diversificata: si spazia dai percorsi umanistici come il Classico e l'Artistico, a quelli tecnico-scientifici come il Nautico e lo Scientifico."
  - Certamente! La nostra offerta include Liceo Artistico, Classico, Scientifico (due opzioni), Linguistico e l'Istituto Tecnico Trasporti e Logistica.
  - In sintesi, offriamo tutti i principali indirizzi liceali e una specializzazione tecnica molto richiesta nel settore dei Trasporti e della Logistica.

# ======================================================================
# 2. SEDI E LOGISTICA
# ======================================================================
- - Quante sedi ha l'istituto e dove si trovano?
  - Dove sono ubicate le diverse sezioni della scuola?
  - La scuola è solo a Policoro o ha altre sedi?
  - In quale città o quartiere si trova la sede centrale?
  - Vorrei sapere dove devo andare per frequentare il Liceo Classico o l'Artistico.
  - "L'istituto ha due sedi: la sede centrale a **Policoro** (Via Puglia) e una sezione associata a **Nova Siri Scalo** (Via Vittorio Bachelet)."
  - Abbiamo la sede principale a Policoro e una sede associata a Nova Siri Scalo. I Licei Classico e Artistico sono ubicati a Nova Siri.
  - La maggior parte degli indirizzi è a Policoro, in Via Puglia. Solo il Liceo Classico e il Liceo Artistico si trovano nella sezione associata di Nova Siri Scalo.
  - Siamo presenti con la sede principale a Policoro e una sezione a Nova Siri Scalo per offrire una migliore copertura del territorio.
  - Se l'interesse è per Classico o Artistico, l'ubicazione è la sede di Nova Siri Scalo. Per tutti gli altri indirizzi, la sede è Policoro.

# ======================================================================
# 3. METODOLOGIE DIDATTICHE E INNOVAZIONE
# ======================================================================
- - Quali metodologie didattiche innovative utilizzate?
  - Le vostre lezioni sono solo frontali o ci sono metodi più moderni?
  - Che tipo di approccio didattico adotta la scuola?
  - Avete corsi che usano la Flipped Classroom?
  - Quali sono i punti di forza della vostra didattica?
  - |
    Oltre alla lezione frontale, la scuola adotta attivamente la **Didattica Laboratoriale** e la **Flipped Classroom** (Classe Capovolta) per un apprendimento più dinamico e partecipativo.
  - |
    Puntiamo molto sull'innovazione, implementando la **Didattica Laboratoriale** per le materie STEM e la **Flipped Classroom** in diverse discipline per coinvolgere gli studenti.
  - |
    Utilizziamo un approccio misto che include l'apprendimento basato sull'esperienza in laboratorio e la metodologia della **Flipped Classroom**.
  - |
    Il nostro approccio è molto pratico. Oltre a garantire solide basi teoriche, l'apprendimento in **laboratorio** e la metodologia della **Classe Capovolta** sono fondamentali nel nostro piano didattico.
  - |
    Sì, la **Flipped Classroom** è uno strumento didattico che utilizziamo per invertire i momenti di studio individuale e discussione in classe, potenziando la partecipazione attiva.

# ======================================================================
# 4. ISTITUTO TECNICO TRASPORTI E LOGISTICA (NAUTICO/TrED)
# ======================================================================
- - Quali sono le specializzazioni e le materie principali del Tecnico Trasporti e Logistica?
  - Cosa si studia in dettaglio al Nautico?
  - Vorrei informazioni sulle materie caratterizzanti del TrED.
  - Il Nautico è certificato o riconosciuto per la formazione marittima?
  - Che tipo di carriera posso aspettarmi dopo il diploma del Nautico?
  - |
    L'indirizzo offre le articolazioni **Conduzione del Mezzo Navale** e **Logistica**. Le materie chiave sono **Scienza della Navigazione**, **Struttura e Costruzione del Mezzo**, e **Elettrotecnica, Elettronica e Automazione**.
  - |
    Il percorso è di alto livello tecnico, focalizzato sulla **Navigazione** e la **Logistica**. Siamo certificati con la **Certificazione di Sistema Gestione Qualità** per la Formazione Marittima, garantendo standard elevati.
  - |
    Le specializzazioni riguardano la Conduzione Navale e la Logistica. Dopo il diploma, è possibile accedere direttamente a carriere nel **settore marittimo** e della **Logistica** o proseguire con **Ingegneria Navale** o le **Accademie Militari**.
  - |
    Si studiano materie tecniche specifiche come la Navigazione e l'Elettrotecnica. La scuola è **certificata** per la formazione marittima.
  - |
    Gli sbocchi lavorativi sono ottimi nel settore marittimo e della Logistica. Le materie distintive preparano perfettamente anche per l'università, in particolare per i percorsi di **Ingegneria**.

# ======================================================================
# 5. LICEO SCIENTIFICO (Differenze e Sbocchi)
# ======================================================================
- - Quali sono le differenze chiave tra Scientifico Tradizionale e Scienze Applicate?
  - Si studia Latino allo Scientifico Scienze Applicate?
  - Perché dovrei scegliere l'opzione Scienze Applicate?
  - C'è una maggiore enfasi sui laboratori nello Scientifico?
  - Quali materie scientifiche sono più approfondite?
  - |
    La differenza principale è che nell'opzione Scienze Applicate, il Latino è sostituito dall'**Informatica** e si utilizza il **laboratorio** di Scienze in modo molto più intensivo e frequente per l'applicazione pratica.
  - |
    Nello Scientifico Scienze Applicate, non si studia il Latino. L'obiettivo è potenziare le competenze digitali e pratiche attraverso l'**Informatica** e l'attività laboratoriale.
  - |
    Se il tuo interesse è per le facoltà STEM e l'applicazione pratica, ti consiglio le Scienze Applicate, che offrono un forte potenziamento di **Informatica** e l'uso continuo dei laboratori di Chimica e Fisica.
  - |
    Entrambi i percorsi hanno Matematica, Fisica e Scienze Naturali. Scienze Applicate, però, si concentra maggiormente sull'aspetto sperimentale e l'Informatica.
  - |
    Lo Scientifico prepara in modo eccellente per **Ingegneria** in tutte le sue forme, **Medicina** e tutte le facoltà tecnico-scientifiche.

# ======================================================================
# 6. PCTO, ORIENTAMENTO E SUPPORTI
# ======================================================================
- - Ci sono percorsi di PCTO (ex Alternanza Scuola-Lavoro) e in quali settori?
  - Vengono offerti servizi di supporto psicologico o orientamento specialistico?
  - La scuola aiuta nella preparazione ai test universitari?
  - Quali sono i progetti attivi per l'orientamento post-diploma?
  - C'è un servizio per il benessere emotivo degli studenti?
  - Sì, sono attivi **diversi percorsi di PCTO** specifici per ogni indirizzo. Inoltre, offriamo un **Sportello d'Ascolto Psicologico** e un servizio costante di **orientamento universitario/lavorativo**.
  - "Assolutamente sì. Per l'orientamento forniamo il progetto **Orienta UNIBAS** e corsi per i test come **MEDITEST - GOMED**. A livello personale, è disponibile lo **Sportello Psicologico**."
  - "Offriamo sostegno a 360 gradi: orientamento lavorativo tramite i **PCTO** e psicologico tramite lo **Sportello d'Ascolto**, oltre a progetti di preparazione ai test universitari."
  - La scuola supporta gli studenti con i **PCTO** e con iniziative come il **Liceo Matematico** e i laboratori scientifici in collaborazione con l'università, preparando per i test d'ingresso.
  - Sì, i servizi includono il supporto psicologico per il benessere, il supporto **orientativo post-diploma** e vari **PCTO** settoriali.

# ======================================================================
# 7. ATTIVITÀ EXTRACURRICULARI E COMPETIZIONI
# ======================================================================
- - Quali attività extra-curriculari culturali e sportive sono disponibili?
  - Si può partecipare a Olimpiadi o concorsi?
  - Avete un gruppo teatro o un giornalino scolastico?
  - Ci sono attività di dibattito o filosofia?
  - Quali servizi extra offrite per la crescita personale?
  - "L'offerta è ricca: **Laboratorio Teatrale**, **Giornalino d'Istituto**, Laboratorio **Podcast**, Progetti di **DEBATE**, **Romanae Disputationes** e l'importante progetto di impegno civile **Service Learning**."
  - "Sì, incoraggiamo la competizione: partecipiamo alle **Olimpiadi** di **Matematica**, **Fisica** e **Filosofia**. Sul piano artistico, c'è il **Laboratorio Teatrale**."
  - Organizziamo numerose attività come il **DEBATE** e le **Romanae Disputationes** (per l'oratoria e il pensiero critico). Per il benessere, c'è il programma **Teen star** sull'affettività.
  - Per le competenze trasversali, si può aderire al **Giornalino**, al **Podcast**, al progetto **Service Learning** e alle competizioni scientifiche e umanistiche (**Olimpiadi**).
  - Offriamo **attività sportive** in palestra e sui campi esterni (calcio, basket, ecc.) e progetti come il **Laboratorio sulle Emozioni** e l'educazione all'affettività.

# ======================================================================
# 8. TRASPORTI E ACCESSIBILITÀ
# ======================================================================
- - Come si raggiunge la sede di Policoro con i mezzi pubblici?
  - Le linee di autobus coprono bene i paesi limitrofi per arrivare a scuola?
  - Ci sono corse degli autobus specifiche per gli studenti pendolari?
  - È facile raggiungere la sede di Nova Siri Scalo?
  - Sono garantiti i collegamenti dai paesi più lontani come Senise o Tursi?
  - |
    La sede di Policoro è ottimamente collegata da una **rete di autobus regionali** (SITA SUD e vettori privati). Le linee coprono tutti i principali comuni del circondario, come Marconia, Tursi, Senise e Rocca Imperiale.
  - |
    Sì, per gli studenti pendolari le corse degli autobus sono strutturate con **frequenza potenziata** negli orari di ingresso e uscita (orari "Feriali Scolastici"), garantendo l'arrivo da tutte le direzioni.
  - |
    I collegamenti sono capillari. Le linee di autobus sono organizzate per collegare i centri dell'interno (come Senise, Tursi, San Giorgio Lucano) al Terminal di Policoro in orari compatibili con l'inizio delle lezioni.
  - |
    Sia Policoro che la sede di **Nova Siri Scalo** sono facilmente accessibili. Nova Siri è collegata con corse dirette e frequenti da Policoro, Marconia e dai paesi vicini.
  - |
    Puoi contare sui servizi di linea che collegano l'area Jonica e l'entroterra direttamente al Terminal di Policoro, che funge da punto di interscambio essenziale.
